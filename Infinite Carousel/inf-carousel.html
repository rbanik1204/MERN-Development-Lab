<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Carousel | CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background:black;
        }
        .carousel {
            width: 80vw;
            height: auto;
            margin: 30vh auto;
            /* border:3px solid blue; */
            overflow: hidden;
            display:flex;
            column-gap: 1rem;
            background:black;
        }

        .group {
            flex:0 0 max-content;
            display: flex;
            overflow-x: auto;
            column-gap:1rem;
            animation: rotate 15s linear infinite;
        }

        
        .child {
            flex: 0 0 30vw;
            height: 30vh;
            background: url('https://images.unsplash.com/photo-1511255656699-6df8cf250a38?ixid=M3w4MjcwNjd8MHwxfHNlYXJjaHw4fHxhbGx8ZW58MHx8fHwxNzg3MzA3MjE5fDA&ixlib=rb-4.1.0&w=1024&h=1980&fit=max&q=80') no-repeat center;
            background-size: cover;
            border-radius:15px;
            padding:5px;
        }
        
        .group::-webkit-scrollbar {
            display: none;
        }
        @keyframes rotate {
            from {
                translate: 0%
            }

            to {
                translate: -100%
            }
        }
    </style>
</head>

<body>
    <div class="carousel">
        <div class="group">
            <div class="child box1"></div>
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
            <div class="child"></div>
        </div>
        <div class="group">
            <div class="child box1"></div>
            <div class="child box2"></div>
            <div class="child box3"></div>
            <div class="child box4"></div>
            <div class="child box5"></div>
        </div>
    </div>
</body>

</html>
